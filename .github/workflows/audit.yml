name: Audit

on:
  push:
    branches: [main]
  pull_request:
  # Release assets can rot between releases (retagged or deleted uploads), and
  # goreleaser only pushes here on release — without a timer nothing revalidates.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    runs-on: macos-latest
    permissions:
      # Only exercised on push to main, by the "Normalize" step below.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Link repo as Homebrew tap
        run: |
          TAP_DIR="$(brew --repository)/Library/Taps/bronto-community/homebrew-tap"
          mkdir -p "$(dirname "$TAP_DIR")"
          rm -rf "$TAP_DIR"
          ln -s "$PWD" "$TAP_DIR"

      # Homebrew requires explicit trust for third-party taps; without this it
      # ignores the casks entirely and `brew audit` cannot resolve them.
      - name: Trust the tap
        run: brew trust --tap bronto-community/tap

      # The casks here are generated by goreleaser, whose built-in cask template
      # is not `brew style`-clean (stanza order, trailing blank line) and offers
      # no knob to change that. Hand-fixing the files is futile — the next
      # release overwrites them — so main normalizes itself rather than going red
      # on every release, which is what happened for six releases straight.
      - name: Normalize generated casks
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # Targets the tap, exactly like the gate below, so the fixer and the
          # gate can never disagree about what is in scope. (Tap mode also
          # covers the workflow files; the cask cop set itself is the same as
          # file mode.) This matters because Homebrew versions differ in which
          # cops they enforce — the runner's brew and a contributor's local brew
          # flag different offences on identical files, so whatever the runner
          # demands is what gets fixed here.
          brew style --fix bronto-community/tap || true
          if git diff --quiet -- Casks; then
            echo "No style normalization needed."
            exit 0
          fi
          git diff --stat -- Casks
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: normalize goreleaser-generated casks [skip ci]" -- Casks

          # Only push when this run's commit is still the branch tip. A re-run
          # checks out the original SHA, so once an earlier run's normalization
          # has landed the push is a guaranteed non-fast-forward — which turned
          # a re-run of the compy v0.1.4 audit red for no real reason. The local
          # tree keeps the fix either way, so the gate below still validates it.
          remote_tip="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          if [ "$remote_tip" != "$GITHUB_SHA" ]; then
            echo "::notice::${GITHUB_REF_NAME} has moved on (tip ${remote_tip} != ${GITHUB_SHA}); skipping the normalization push."
            exit 0
          fi
          # Explicit refspec: checkout leaves HEAD detached on push events.
          #
          # Distinguish a lost race from a broken push. Swallowing every failure
          # would be silently fatal: `brew style` below runs on the local tree,
          # which is already fixed, so the job would go green forever while the
          # normalization never actually landed in git. Since the tip matched
          # moments ago, a failure is only benign if the tip has since moved.
          if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
            new_tip="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
            if [ "$new_tip" != "$remote_tip" ]; then
              echo "::warning::normalization push lost a race (tip moved to ${new_tip}); a later run will redo it."
            else
              echo "::error::normalization push failed while ${GITHUB_REF_NAME} stayed at ${remote_tip} — a credentials or permissions problem, not a race."
              exit 1
            fi
          fi

      - name: brew style
        run: brew style bronto-community/tap

      # Audit every cask in the tap, so a newly added cask cannot land unchecked
      # the way compy did.
      - name: brew audit
        env:
          # Keeps --online from tripping over unauthenticated GitHub rate limits.
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          casks=()
          for f in Casks/*.rb; do
            casks+=("bronto-community/tap/$(basename "$f" .rb)")
          done
          echo "Auditing: ${casks[*]}"

          # --online downloads every archive, so it inherits GitHub's asset-CDN
          # flakiness. The v0.5.2 release failed this step on a bare
          # `curl: (56) ... error: 504` against a tarball that was fine minutes
          # later — a false alarm on a freshly published asset. Retry before
          # believing it; a real problem still fails, just 90s later.
          for attempt in 1 2 3; do
            if brew audit --cask --strict --online "${casks[@]}"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::brew audit attempt ${attempt}/3 failed; retrying in $((attempt * 30))s"
              sleep "$((attempt * 30))"
            fi
          done
          echo "::error::brew audit failed 3 consecutive attempts — treating as real."
          exit 1

  # A red run on main notified nobody, so six consecutive release failures went
  # unnoticed. Surface them as an issue instead.
  notify:
    needs: audit
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job has no checkout, so gh cannot infer the repository from a
          # git remote — without this every gh call dies on "failed to run git:
          # fatal: not a git repository", which is exactly how the first real
          # audit failure managed to notify nobody.
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Audit failing on main"
          gh label create audit-failure --color B60205 \
            --description "Tap audit/style is red on main" 2>/dev/null || true
          # The heredoc body sits at the block-scalar indent, which YAML strips,
          # so it lands at column 0. The quoted delimiter keeps it literal.
          # Backticks are escaped rather than single-quoted: inside double quotes
          # \` is a literal backtick, so markdown survives without shellcheck
          # mistaking it for command substitution.
          {
            printf "\`Audit\` failed on \`%s\` (\`%s\`).\n\n" \
              "$GITHUB_REF_NAME" "$GITHUB_EVENT_NAME"
            printf -- '- Run: %s\n' "$RUN_URL"
            printf -- "- Commit: \`%s\`\n\n" "$GITHUB_SHA"
            cat <<'EOF'
          Reproduce locally:

          ```sh
          brew tap bronto-community/tap
          brew style bronto-community/tap
          brew audit --cask --strict --online bronto-community/tap/<cask>
          ```
          EOF
          } > /tmp/body.md
          existing="$(gh issue list --state open --search "$TITLE in:title" \
            --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/body.md
          else
            gh issue create --title "$TITLE" --label audit-failure --body-file /tmp/body.md
          fi
